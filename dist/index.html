<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有医帮 - 互联网医疗平台</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="icon" href="assets/images/favicon.ico">
</head>
<body class="bg-cream">
    <div id="root"></div>
    
    <!-- 预加载样式 -->
    <style>
        :root {
            --primary: #6B8E23;
            --secondary: #F8F4E9;
            --accent: #D4AF37;
            --text: #333;
            --border-radius: 12px;
            --shadow: 0 4px 12px rgba(107, 142, 35, 0.15);
        }
        
        .bg-cream { background-color: var(--secondary); }
        .text-primary { color: var(--primary); }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary), #4a6b1e);
            color: white;
        }
    </style>
</body>
